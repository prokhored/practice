<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Авторизация</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card" aria-labelledby="auth-title">
            <div class="auth-logo"><img src="./metube.png" height="50" alt="MeTube"></div>
            <h1 id="auth-title">Вход в аккаунт</h1>
            <p class="auth-subtitle">Войдите, чтобы продолжить</p>

            <form class="auth-form">
                <label for="email">Электронная почта</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Введите email"
                    autocomplete="email"
                >

                <label for="password">Пароль</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                >

                <div class="auth-actions">
                    <button type="button" class="auth-button auth-button-primary" id="auth">Авторизироваться</button>
                    <button type="button" class="auth-button auth-button-secondary" id="reg">Зарегистрироваться</button>
                </div>
                <p id="auth-message" class="auth-message" role="alert" aria-live="polite"></p>
            </form>
        </section>
    </main>
<script>
    const message = document.getElementById("auth-message");

    function showMessage(text, isError = true) {
        message.textContent = text;
        message.className = isError
            ? "auth-message auth-message-error"
            : "auth-message auth-message-success";
    }

    document.getElementById("reg").onclick = async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("Введите email и пароль");
            return;
        }

        try {
            const response = await fetch("/reg", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showMessage(data.error || data.err || data.message || `Ошибка сервера: ${response.status}`);
                return;
            }

            window.location.href = data.redirect || "/site.html";
        } catch (error) {
            console.error(error);
            showMessage("Не удалось связаться с сервером");
        }
    };
    document.getElementById("auth").onclick = async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        if (!email || !password) {
            showMessage("Введите email и пароль");
            return;
        }

        try {
            const response = await fetch("/auth", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                showMessage(data.error || data.err || data.message || `Ошибка сервера: ${response.status}`);
                return;
            }
            window.location.href = data.redirect || "/site.html";
        } catch (error) {
            console.error(error);
            showMessage("Не удалось связаться с сервером");
        }

    }
</script>
</body>

</html>

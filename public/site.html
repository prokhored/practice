                    </a><br>
                </ul>
                <ul class="deuxiemeul">

                    <li><a href="#" data-page="development">
                        <p style="font-size: 20px;">Вы &gt;</p>
                        </a></li>
                    <li><a href="#" data-page="development">
                            <p style="font-size: 20px;"><img src="./YouTube_files/ch.png" height="20">Канал</p>
                        </a></li>
                    <li><a href="#" data-page="development">

                <ul>
                    <li>
                        <p style="font-size: 20px;"> Подписки </p>
                    </li>
                </ul>

        </div>
        <div>
            <div class="top bar">
                <a class="top-logo" href="/site.html"><img src="./YouTube_files/yt.png" height="50" alt="YouTube"></a>
                <button id="logout" class="logout-button" type="button">Выйти</button>
                <div class="srchbar">
                    <form method="get " action="">
                        <input type="text"placeholder="Поиск">
                        <button class="srchbutton" ><img src="./YouTube_files/src.png" style="width:35px; align-self: center; text-align: center; " ></button>
                    </form>
                </div>
               
            </div>
            <div id="video-page" class="video-page">
                <div class="videos"></div>
            </div>
        </div>
    </div>



    <script src="./site.js"></script>
    <script>
        document.getElementById("logout").addEventListener("click", async () => {
            try {
                const response = await fetch("/logout", { method: "POST" });

                if (!response.ok) {
                    throw new Error("Не удалось завершить сессию");
                }

                const data = await response.json();
                window.location.href = data.redirect || "/auth.html";
            } catch (error) {
                console.error(error);
                alert("Не удалось выйти из аккаунта");
            }
        });
    </script>
